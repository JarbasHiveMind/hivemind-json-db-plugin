name: Policy Migration E2E

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  policy_e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Cross-repo policy stack lives in the [integration] extra (versions in
      # pyproject, not pinned here) so it tracks the latest published prereleases.
      - run: pip install --pre -e ".[integration]"
      # hivemind-core pulls the published json plugin; restore the editable build
      - run: pip install -e . --no-deps --force-reinstall
      - run: pytest tests/e2e/test_policy_migration_e2e.py -q -p no:cacheprovider
